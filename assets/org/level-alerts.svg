<text x="684" y="348" font-size="11.5" fill="#3f4f47" >15-minute readings.</text>
<text x="24" y="490" font-size="10.5" fill="#6b7872" >Concept interface, not a delivered product. It replays real 15-minute Environment Agency readings, as published (unchecked). The Kettlewell trigger is the</text>
<text x="24" y="504" font-size="10.5" fill="#6b7872" >Environment Agency's published typical high; the other two triggers are illustrative, set at the 99.5th percentile of each gauge's readings for October 2025 to September 2026.</text>
